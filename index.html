<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#efeeeb;color:#222;font-size:16px;-webkit-text-size-adjust:100%}
a{color:#d9731a}

.drawer{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:80%;background:#2b2b2b;z-index:40;-webkit-transform:translateX(-105%);transform:translateX(-105%);-webkit-transition:-webkit-transform .25s ease;transition:transform .25s ease;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.drawer.open{-webkit-transform:translateX(0);transform:translateX(0);box-shadow:4px 0 16px rgba(0,0,0,.35)}

.cgl{-webkit-column-count:2;column-count:2;-webkit-column-gap:18px;column-gap:18px;font-size:9.5px;line-height:1.35}
.renta-top{display:flex;flex-wrap:wrap;align-items:center}
.renta-donut{flex:0 0 auto;margin:0 20px 8px 0}
.renta-kpi{flex:1 1 230px}
.renta-kpi>div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}

.hbar{display:flex;align-items:center;margin:8px 0}

.ck{display:inline-block;border:1px solid #ccc;background:#fff;border-radius:16px;padding:7px 11px;margin:0 6px 6px 0;font-size:13px;cursor:pointer;-webkit-appearance:none;font-family:inherit;color:#333}

main{max-width:1020px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:22px;margin:2px 0 12px}
h2{font-size:18px;margin:0 0 10px}
.muted{color:#777}
.small{font-size:13px}
.btn{display:inline-block;background:#f28c28;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;margin:0 6px 6px 0;text-decoration:none;cursor:pointer;-webkit-appearance:none;font-family:inherit;line-height:1.2}
.btn.sec{background:#e4e3e0;color:#222}

label{display:block;font-size:13px;color:#666;margin:8px 0 3px}
input,select,textarea{width:100%;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:6px;background:#fff;font-family:inherit;color:#222}
input[type=checkbox]{width:auto;-webkit-transform:scale(1.4);transform:scale(1.4);margin:0 8px 0 4px}

.grid{display:flex;flex-wrap:wrap;margin:0 -6px}
.grid>div{padding:0 6px;flex:1 1 200px;min-width:0}
.grid>div.w2{flex:2 1 300px}
.row{display:flex;align-items:center;flex-wrap:wrap;padding:11px 4px;border-bottom:1px solid #eee;text-decoration:none;color:#222}
.row:last-child{border-bottom:0}
.row .main{flex:1 1 220px;min-width:0}
.row .side{text-align:right;flex:0 0 auto;margin-left:10px}
.row b{display:block}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:#ddd;color:#333}
.st-0{background:#e4e3e0}.st-1{background:#d6e6f5;color:#1b4f80}.st-2{background:#fde3c8;color:#9a4a00}.st-3{background:#f8d36b;color:#5a4300}.st-4{background:#cfe8d4;color:#1e6630}.st-5{background:#2e7d32;color:#fff}
.stats{display:flex;flex-wrap:wrap;margin:0 -7px 7px}
.stat{flex:1 1 150px;background:#2b2b2b;color:#fff;border-radius:10px;padding:12px 14px;margin:0 7px 7px}
.stat .v{font-size:22px;font-weight:700;color:#f28c28}

.todo{display:flex;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid #eee}

.poste{border-left:5px solid #f28c28}

.ph{display:flex;align-items:center}
.pnum{background:#2b2b2b;color:#fff;border-radius:6px;padding:6px 10px;font-weight:700;margin-right:8px}
.ptitre{font-weight:700;font-size:17px}
.lhead{display:flex;font-size:12px;color:#888;margin-top:12px;padding:0 3px}

.ligne>div{padding:3px}
.l-des{flex:1 1 240px;min-width:0}

.l-u{flex:0 0 96px}
.l-pu{flex:0 0 100px}
.l-tot{flex:0 0 104px;text-align:right;font-weight:600;font-size:15px}
.l-x{flex:0 0 auto;white-space:nowrap}
.pfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px}
.stot{font-weight:700;font-size:16px}
.recap div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
.recap div.big{font-size:18px;font-weight:700;border-bottom:0;color:#d9731a}
.chk{display:flex;align-items:center;margin-top:12px;font-size:15px}
.sigbox{border:1px dashed #bbb;border-radius:8px;min-height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;background:#fafafa}
.sigbox img{max-width:100%;max-height:110px}
.hidden{display:none!important}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 10px}
.modal-box{background:#fff;border-radius:12px;max-width:720px;margin:0 auto;padding:16px}
#sigc{width:100%;height:auto;border:1px solid #bbb;border-radius:8px;background:#fff;touch-action:none;display:block;margin-bottom:10px}
.calcres{background:#f7f5f1;border-radius:8px;padding:10px;margin:12px 0}
.calcres div{display:flex;justify-content:space-between;padding:4px 0}
.toast{position:fixed;left:50%;bottom:24px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px}
.cat-row{display:flex;flex-wrap:wrap;align-items:center;border-bottom:1px solid #eee;padding:4px 0}
.cat-row>div{padding:3px}
/* Document devis */
.docwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.doc{background:#fff;width:794px;margin:0 auto 20px;padding:34px 38px;font-size:11.5px;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.doc table{width:100%;border-collapse:collapse}
.dh td{vertical-align:top;padding:6px 8px;border:1px solid #333}
.dh .dh-r{text-align:center;width:30%}
.dbar{display:flex;justify-content:space-around;border:1px solid #333;border-top:0;padding:5px;font-weight:600}
.dinfo{border:1px solid #333;border-top:0;padding:8px 12px}
.dinfo p{margin:3px 0}
.dt{margin-top:10px}
.dt th{text-align:left;border-bottom:1.5px solid #333;padding:5px 4px;font-size:11px}
.dt td{padding:3px 4px;vertical-align:top}
.dt .r{text-align:right;white-space:nowrap}
.dt .c{text-align:center}
.dt tr.sec td{padding-top:12px;font-weight:700}
.dt tr.st td{font-weight:700;border-top:1px solid #999}

.dbox{border:1px solid #333;padding:8px 12px;margin-top:12px;white-space:pre-wrap}
.dpay{border:1.5px solid #333;padding:8px 12px;margin-top:12px;display:flex;justify-content:space-between;font-weight:700;font-size:13px}

.dsig>div{flex:1;padding:8px 12px;min-height:120px}
.dsig img{max-height:80px;max-width:100%}
.dfoot{margin-top:10px;font-size:10.5px;text-align:center}
/* Planning */
.plan-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.plan-title{font-size:17px;font-weight:700;margin:6px 0 8px}
.day{border-bottom:1px solid #eee;padding:8px 0;display:flex}
.day:last-child{border-bottom:0}
.day .dl{flex:0 0 112px;font-weight:700;font-size:14px;text-transform:capitalize}
.day .dl.today{color:#d9731a}
.day .di{flex:1;min-width:0}
.chip{display:block;padding:6px 9px;border-radius:6px;margin:0 0 5px;font-size:14px;color:#fff;text-decoration:none;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-chantier{background:#f28c28}.k-location{background:#2f6fb0}.k-livraison{background:#7b5ea7}.k-perso{background:#555}.k-commande{background:#8a8a8a}.k-paiement{background:#2e7d32}.k-heures{background:#c0392b}.k-devis{background:#f6c08a;color:#222!important}
.legend{margin-top:6px}
.legend span{display:inline-block;margin:0 10px 4px 0;font-size:12px;color:#555}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.mtab{width:100%;border-collapse:collapse;table-layout:fixed}
.mtab th{font-size:12px;color:#888;padding:4px;font-weight:600}
.mtab td{border:1px solid #e6e6e6;vertical-align:top;height:96px;padding:3px;cursor:pointer;overflow:hidden}
.mtab td.out{background:#f7f7f5;color:#aaa}
.mtab .dn{font-size:12px;font-weight:700;display:inline-block;margin-bottom:2px;padding:0 5px}
.mtab td.today .dn{background:#f28c28;color:#fff;border-radius:10px}
.mtab .chip{font-size:11px;padding:2px 4px;margin-bottom:2px;border-radius:4px}

@media (max-width:600px){
 .mtab td{height:58px}
 .mtab .chip{font-size:0;height:6px;padding:0;margin:1px 0}
 .more{font-size:9px}
 .brand{font-size:16px}
}
.phgrid{display:flex;flex-wrap:wrap;margin:6px -4px}
.thumb{position:relative;width:96px;height:96px;margin:4px;border-radius:8px;overflow:hidden;background:#e4e3e0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .btn{position:absolute;top:3px;right:3px;margin:0;padding:3px 7px;font-size:12px}
.mthumb{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#e4e3e0;margin-right:12px;flex:0 0 60px;display:block}
.edlph img{max-width:32%;max-height:210px;width:auto;margin:.5%;vertical-align:top}
@media (max-width:600px){
 .lhead{display:none}
 .l-des{flex:1 1 100%}
 .l-q{flex:1 1 60px}.l-u{flex:1 1 70px}.l-pu{flex:1 1 80px}.l-tot{flex:1 1 90px}
}
@media print{
 @page{size:A4;margin:10mm}
 .no-print,.top{display:none!important}
 body{background:#fff}
 main{padding:0;max-width:none}
 .docwrap{overflow:visible}
 .doc{box-shadow:none;margin:0;width:auto;padding:0}
 .dt tr{page-break-inside:avoid}
}
</style>

<body>
<header class="top no-print">
 <button class="burger" id="burger" aria-label="Menu">☰</button>
 <a href="#home" class="brand">Chantiers</a>
 <button id="syncBtn" class="syncb hidden" data-a="syncNow"></button>
</header>
<div class="veil no-print" id="veil"></div>
<nav class="drawer no-print" id="drawer">
 <div class="dhead">Chantiers</div>
 <a href="#home"><span class="ic">🏠</span>Tableau de bord</a>
 <a href="#devislist"><span class="ic">📄</span>Devis</a>
 <a href="#chantiers"><span class="ic">🏗️</span>Chantiers</a>
 <a href="#clients"><span class="ic">👤</span>Clients</a>
 <a href="#planning"><span class="ic">📅</span>Planning</a>
 <a href="#parc"><span class="ic">🚜</span>Parc et locations</a>
 <a href="#renta"><span class="ic">📈</span>Rentabilité</a>
 <a href="#catalogue"><span class="ic">📋</span>Catalogue</a>
 <a href="#reglages"><span class="ic">⚙️</span>Réglages</a>
</nav>
<main id="app"></main>
<div id="modal" class="modal no-print hidden"><div class="modal-box" id="modal-box"></div></div>
<datalist id="unites"></datalist>
<datalist id="cat"></datalist>
<datalist id="machines"></datalist>
<script>
(function(){
'use strict';
var KEY='chantiers_v1';
var STATUTS=['brouillon','envoyé','signé','en cours','terminé','payé'];
var UNITES=['u','m','ML','m²','m³','t','kg','heure','jour','forfait','paquet','panneau','rouleau','barre','pièce','cartouche','sac','palette','km'];
var state=null, cur=null, saveTimer=null;

/* ---------- outils ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0;}
function eur(n){return num(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function fq(n){return num(n).toLocaleString('fr-FR',{maximumFractionDigits:3});}
function pad(n){return ('0'+n).slice(-2);}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function parseISO(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function frDate(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function longDate(s){var d=parseISO(s);if(!d)return '';return ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()]+' '+d.getDate()+' '+['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'][d.getMonth()]+' '+d.getFullYear();}
function stamp(ts){if(!ts)return '';var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' à '+pad(d.getHours())+'h'+pad(d.getMinutes());}
function sel(a,b){return a===b?' selected':'';}
function $(id){return document.getElementById(id);}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2200);}

/* ---------- données ---------- */
function defState(){return {version:1,settings:{noms:'',adresse1:'',adresse2:'',tel:'',mail:'',iban:'',bic:'',taux:'20',deplacement:'80',delaiCommande:'3',limites:'',prixKm:'0.6',acomptePct:'50',meteoVille:'Willerval',cgl:'',siret:'',condLoc:'Le matériel est remis en bon état de marche et doit être rendu propre, à la date prévue. Toute casse, perte ou usure anormale est à la charge du locataire. La caution est restituée au retour après contrôle.'},catalogue:[],devis:[],seq:{},events:[],machines:[],locations:[],deleted:{},settingsModif:0,clients:[]};}
function load(){
 try{var s=localStorage.getItem(KEY);state=s?JSON.parse(s):defState();}catch(e){state=defState();}
 var d=defState();
 if(!state.settings)state.settings={};
 for(var k in d.settings){if(state.settings[k]===undefined)state.settings[k]=d.settings[k];}
 if(!state.catalogue)state.catalogue=[];
 if(!state.devis)state.devis=[];
 if(!state.seq)state.seq={};
 if(!state.events)state.events=[];
 if(!state.machines)state.machines=[];
 if(!state.locations)state.locations=[];
 if(!state.deleted)state.deleted={};
 if(!state.clients)state.clients=[];
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state));}
 catch(e){alert('Mémoire pleine ou indisponible. Fais une sauvegarde dans Réglages, puis supprime d’anciens devis ou signatures.');}
 syncSoon();
}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){saveTimer=null;save();},400);}
function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;save();}}
window.addEventListener('pagehide',flush);
window.addEventListener('beforeunload',flush);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
function touch(){if(cur)cur.modifieLe=Date.now();}

function ligneTot(l){return num(l.qte)*num(l.pu);}
function posteTot(p){var t=0;for(var i=0;i<p.lignes.length;i++)t+=ligneTot(p.lignes[i]);return t;}
function totaux(d){var c=0,f=0;d.postes.forEach(function(p){if(p.type==='client')c+=posteTot(p);else f+=posteTot(p);});return {client:c,facture:f,global:c+f};}

function newNumero(){var d=new Date();var k=d.getFullYear()+pad(d.getMonth()+1);state.seq[k]=(state.seq[k]||0)+1;return 'DA'+k+'-'+('00'+state.seq[k]).slice(-3);}
function newDevis(){
 var d={id:uid(),numero:newNumero(),indice:'A',date:today(),statut:'brouillon',client:{nom:'',adresse:'',ville:'',tel:'',mail:''},lieu:'',reference:'',description:'',dateChantier:'',echeance:'',postes:[],limites:state.settings.limites||'',planning:'',sigClient:'',sigPresta:'',sigDate:'',creeLe:Date.now(),modifieLe:Date.now()};
 state.devis.unshift(d);save();return d;
}
function newPoste(type,titre){return {id:uid(),titre:titre||'',type:type,fournisseur:'',devisNum:'',devisDate:'',dateCommande:'',commande:false,note:'',lignes:[]};}
function newLigne(des,qte,unite,pu){return {id:uid(),des:des||'',qte:qte==null?'':String(qte),unite:unite||'u',pu:pu==null?'':String(pu)};}
function getDevis(id){for(var i=0;i<state.devis.length;i++)if(state.devis[i].id===id)return state.devis[i];return null;}
function findCat(des){var k=String(des||'').trim().toLowerCase();if(!k)return null;for(var i=0;i<state.catalogue.length;i++){if(String(state.catalogue[i].des).trim().toLowerCase()===k)return state.catalogue[i];}return null;}

function refreshDatalists(){

/* ---------- planning : données ---------- */
var TYPES={chantier:'Chantier',location:'Location',livraison:'Livraison / enlèvement',perso:'Autre'};
var JOURS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var plan={mode:'semaine',ref:null},pendingEv=null;
function mondayOf(s){var d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function evEnd(e){return e.fin&&e.fin>=e.debut?e.fin:e.debut;}
function evOn(e,ds){return e.debut<=ds&&ds<=evEnd(e);}
function hasEvent(id){for(var i=0;i<state.events.length;i++)if(state.events[i].devisId===id)return state.events[i];return null;}
function getEv(id){for(var i=0;i<state.events.length;i++)if(state.events[i].id===id)return state.events[i];return null;}
function itemsOn(ds){
 var out=[];
 state.events.forEach(function(e){if(evOn(e,ds))out.push({k:e.type,ev:e,label:(e.heure?e.heure.replace(':','h')+' ':'')+(e.titre||TYPES[e.type])+(e.machine?' ('+e.machine+')':'')});});
 (state.locations||[]).forEach(function(L){if(L.statut!=='annulée'&&L.debut&&L.debut<=ds&&ds<=locEnd(L))out.push({k:'location',loc:L,label:mName(L.machineId)+', '+(L.client.nom||L.numero)});});
 state.devis.forEach(function(d){
  if(d.statut==='payé'||d.statut==='brouillon')return;
  if(d.statut==='terminé'&&d.suivi&&!d.suivi.heuresEnvoyees&&(d.suivi.termineLe||today())===ds)out.push({k:'heures',d:d,label:'Envoyer heures réelles : '+(d.client.nom||d.numero)});
  if(d.dateChantier===ds&&!hasEvent(d.id))out.push({k:'devis',d:d,label:'Chantier à planifier : '+(d.client.nom||d.numero)});
  d.postes.forEach(function(p){if(p.type==='client'&&p.dateCommande===ds&&!p.commande)out.push({k:'commande',d:d,label:'Commander '+(p.titre||'matériaux')+(p.fournisseur?' ('+p.fournisseur+')':'')});});
  if(d.echeance===ds&&(d.statut==='signé'||d.statut==='en cours'||d.statut==='terminé'))out.push({k:'paiement',d:d,label:'Paiement '+(d.client.nom||d.numero)+', '+eur(totaux(d).facture)});
 });
 out.forEach(function(x){x.ds=ds;});
 out.sort(function(a,b){var ha=a.ev&&a.ev.heure?a.ev.heure:'99',hb=b.ev&&b.ev.heure?b.ev.heure:'99';return ha<hb?-1:ha>hb?1:0;});
 return out;
}
function chipWx(it){
 var pl='';
 if(it.ev&&it.ev.type==='chantier'){pl=it.ev.lieu;if(!pl&&it.ev.devisId){var dv=getDevis(it.ev.devisId);if(dv)pl=dv.lieu;}pl=pl||wxBase();}
 else if(it.k==='devis'&&it.d)pl=it.d.lieu||wxBase();
 return pl&&it.ds?' data-wxp="'+esc(pl)+'" data-wxd="'+it.ds+'"':'';
}
function chip(it){
 if(it.loc)return '<a class="chip k-location" href="#location-'+it.loc.id+'">'+esc(it.label)+'</a>';
 if(it.ev)return '<a class="chip k-'+it.k+'" data-a="evEdit" data-id="'+it.ev.id+'"'+chipWx(it)+'>'+esc(it.label)+'</a>';
 return '<a class="chip k-'+it.k+'" href="#devis-'+it.d.id+'"'+chipWx(it)+'>'+esc(it.label)+'</a>';
}
function dayLabel(ds){var d=parseISO(ds);return JOURS[(d.getDay()+6)%7]+'<br><span class="small muted">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</span><div class="wx" data-wx="'+ds+'"></div>';}
function conflicts(e){
 var m=String(e.machine||'').trim().toLowerCase(),out=[];if(!m)return out;
 state.events.forEach(function(o){if(o.id!==e.id&&String(o.machine||'').trim().toLowerCase()===m&&o.debut<=evEnd(e)&&e.debut<=evEnd(o))out.push(o);});
 (state.locations||[]).forEach(function(L){if(L.statut!=='annulée'&&L.debut&&String(mName(L.machineId)).trim().toLowerCase()===m&&L.debut<=evEnd(e)&&e.debut<=locEnd(L))out.push({titre:'Location '+(L.client.nom||L.numero),debut:L.debut,fin:L.fin});});
 return out;
}
function periode(e){return e.fin&&e.fin>e.debut?'du '+frDate(e.debut)+' au '+frDate(e.fin):'le '+frDate(e.debut);}

/* ---------- rappels ---------- */
function gcal(title,date,details){var a=date.replace(/-/g,''),b=addDays(date,1).replace(/-/g,'');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+a+'/'+b+'&details='+encodeURIComponent(details||'');}
function rappels(){
 var out=[],t=today();
 state.devis.forEach(function(d){
  var actif=(d.statut==='signé'||d.statut==='en cours');
  if(actif){d.postes.forEach(function(p){
   if(p.type==='client'&&p.dateCommande&&!p.commande){
    var n=daysBetween(t,p.dateCommande);
    if(n<=7)out.push({n:n,date:p.dateCommande,d:d,txt:'Commander '+(p.titre||'matériaux')+(p.fournisseur?' chez '+p.fournisseur:'')+(p.devisNum?' (devis '+p.devisNum+')':'')});
   }
  });}
  if((actif||d.statut==='terminé')&&d.echeance){
   var n2=daysBetween(t,d.echeance);
   if(n2<=1)out.push({n:n2,date:d.echeance,d:d,pay:true,txt:(n2<0?'Relancer le paiement de ':'Paiement attendu de ')+(d.client.nom||'client')+', '+eur(totaux(d).facture)});
  }
 });
 state.devis.forEach(function(d){
  if(d.statut!=='terminé'||!d.suivi||d.suivi.heuresEnvoyees)return;
  var td=d.suivi.termineLe||t;
  out.push({n:Math.min(0,daysBetween(t,td)),date:td,d:d,txt:'Envoyer les heures réelles à '+(d.client.nom||'client')+' ('+fq(bilan(d).hr)+' h)'});
 });
 state.locations.forEach(function(L){
  if(L.statut==='réservée'&&L.debut){var n=daysBetween(t,L.debut);if(n<=1)out.push({n:n,date:L.debut,loc:L,txt:'Sortie '+mName(L.machineId)+' pour '+(L.client.nom||'client')+(L.contrat&&L.contrat.sigLoc?'':', contrat à faire signer')+(L.acompteRecu?'':', acompte de '+eur(locCalc(L).acompte)+' à encaisser')});}
  if(L.statut==='sortie'){var f=locEnd(L),n3=daysBetween(t,f);if(n3<=1)out.push({n:n3,date:f,loc:L,txt:'Retour '+mName(L.machineId)+' de '+(L.client.nom||'client')});}
  if(L.statut==='rendue'){out.push({n:Math.min(0,daysBetween(t,locEnd(L))),date:t,loc:L,txt:'Encaisser le solde de '+(L.client.nom||'client')+', '+eur(locCalc(L).reste)});}
 });
 state.machines.forEach(function(m){if(entretienDu(m))out.push({n:0,date:t,mach:m,txt:'Entretien à prévoir : '+(m.nom||'machine')+' ('+fq(m.heures)+' h)'});});
 out.sort(function(a,b){return a.n-b.n;});
 return out;
}
function whenTag(n){if(n<0)return '<span class="when late">Retard '+(-n)+' j</span>';if(n===0)return '<span class="when now">Aujourd’hui</span>';if(n===1)return '<span class="when">Demain</span>';return '<span class="when">Dans '+n+' j</span>';}

var DB=null,autoOrient=null;
function idb(cb){
 if(DB)return cb(DB);
 try{var r=indexedDB.open('chantiers_photos',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('p');};
  r.onsuccess=function(){DB=r.result;cb(DB);};
  r.onerror=function(){cb(null);};
 }catch(e){cb(null);}
}
function phPut(id,data,cb){idb(function(db){if(!db){cb(false);return;}try{var tx=db.transaction('p','readwrite');tx.objectStore('p').put(data,id);tx.oncomplete=function(){cb(true);};tx.onerror=function(){cb(false);};}catch(e){cb(false);}});}
function phGet(id,cb){idb(function(db){if(!db)return cb(null);try{var rq=db.transaction('p','readonly').objectStore('p').get(id);rq.onsuccess=function(){cb(rq.result||null);};rq.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function idbDel(id){if(!id)return;idb(function(db){if(!db)return;try{db.transaction('p','readwrite').objectStore('p').delete(id);}catch(e){}});}
function hydrate(){var ims=document.querySelectorAll('img[data-ph]');for(var i=0;i<ims.length;i++)(function(im){var id=im.getAttribute('data-ph');phGet(id,function(d){if(d)im.src=d;else fetchPhoto(id,function(d2){if(d2)im.src=d2;});});})(ims[i]);}
function detectOrient(cb){
 if(autoOrient!==null)return cb(autoOrient);
 try{
  var c=document.createElement('canvas');c.width=2;c.height=1;
  var bin=atob(c.toDataURL('image/jpeg').split(',')[1]);
  var ex=[0xFF,0xE1,0x00,0x22,0x45,0x78,0x69,0x66,0x00,0x00,0x4D,0x4D,0x00,0x2A,0x00,0x00,0x00,0x08,0x00,0x01,0x01,0x12,0x00,0x03,0x00,0x00,0x00,0x01,0x00,0x06,0x00,0x00,0x00,0x00,0x00,0x00];
  var out=new Uint8Array(bin.length+ex.length),k;
  out[0]=bin.charCodeAt(0);out[1]=bin.charCodeAt(1);
  for(k=0;k<ex.length;k++)out[2+k]=ex[k];
  for(k=2;k<bin.length;k++)out[k+ex.length]=bin.charCodeAt(k);
  var url=URL.createObjectURL(new Blob([out],{type:'image/jpeg'})),im=new Image();
  im.onload=function(){autoOrient=(im.naturalWidth===1&&im.naturalHeight===2);URL.revokeObjectURL(url);cb(autoOrient);};
  im.onerror=function(){autoOrient=false;cb(false);};
  im.src=url;
 }catch(e){autoOrient=false;cb(false);}
}
function exifOrientation(buf){
 try{var v=new DataView(buf);if(v.getUint16(0,false)!==0xFFD8)return 1;
  var len=v.byteLength,off=2;
  while(off<len-4){
   var mk=v.getUint16(off,false);off+=2;
   if(mk===0xFFE1){
    if(v.getUint32(off+2,false)!==0x45786966)return 1;
    var t=off+8,little=v.getUint16(t,false)===0x4949,ifd=t+v.getUint32(t+4,little),n=v.getUint16(ifd,little);
    for(var i=0;i<n;i++){var e=ifd+2+i*12;if(v.getUint16(e,little)===0x0112)return v.getUint16(e+8,little);}
    return 1;
   }else if((mk&0xFF00)!==0xFF00)break;
   else off+=v.getUint16(off,false);
  }
 }catch(e){}
 return 1;
}
function processPhoto(file,cb){
 detectOrient(function(auto){
  var rd=new FileReader();
  rd.onload=function(){
   var o=auto?1:exifOrientation(rd.result),url=URL.createObjectURL(file),im=new Image();
   im.onload=function(){
    var W=im.naturalWidth,H=im.naturalHeight,sc=Math.min(1,1100/Math.max(W,H)),w=Math.round(W*sc),h=Math.round(H*sc),c=document.createElement('canvas'),x=c.getContext('2d');
    if(o>=5&&o<=8){c.width=h;c.height=w;}else{c.width=w;c.height=h;}
    switch(o){case 2:x.transform(-1,0,0,1,w,0);break;case 3:x.transform(-1,0,0,-1,w,h);break;case 4:x.transform(1,0,0,-1,0,h);break;case 5:x.transform(0,1,1,0,0,0);break;case 6:x.transform(0,1,-1,0,h,0);break;case 7:x.transform(0,-1,-1,0,h,w);break;case 8:x.transform(0,-1,1,0,0,w);break;}
    x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
    var id='ph_'+uid();
    phPut(id,c.toDataURL('image/jpeg',0.6),function(ok){cb(ok?id:null);});
   };
   im.onerror=function(){cb(null);};
   im.src=url;
  };
  rd.onerror=function(){cb(null);};
  rd.readAsArrayBuffer(file);
 });
}

function newMachine(){var m={id:uid(),nom:'',type:'',marque:'',modele:'',serie:'',annee:'',heures:'',photo:'',intervalle:'',note:'',tarifs:{jour:'',weekend:'',semaine:'',caution:'',nettoyage:'',usureMm:''},entretien:[],creeLe:Date.now(),modifieLe:Date.now()};state.machines.push(m);save();return m;}
function edlBlank(){return {date:'',heures:'',carburant:'',mesure:'',remarques:'',photos:[],sig:''};}
function newLocNum(){var d=new Date(),k='L'+d.getFullYear()+pad(d.getMonth()+1);state.seq[k]=(state.seq[k]||0)+1;return 'LOC'+k.slice(1)+'-'+('00'+state.seq[k]).slice(-3);}
function newLoc(mid){
 var L={id:uid(),numero:newLocNum(),machineId:mid||'',statut:'réservée',client:{nom:'',tel:'',adresse:''},debut:today(),fin:today(),forfait:'auto',nettoyage:false,km:'',carburantEur:'',fraisLib:'',fraisEur:'',remise:'',caution:'',cautionRendue:false,sortie:edlBlank(),retour:edlBlank(),note:'',creeLe:Date.now(),modifieLe:Date.now()};
 var m=getMachine(mid);if(m)L.caution=m.tarifs.caution||'';
 state.locations.unshift(L);save();return L;
}
function locEnd(L){return L.fin&&L.fin>=L.debut?L.fin:L.debut;}
function locDays(L){return L.debut?daysBetween(L.debut,locEnd(L))+1:0;}
function locCalc(L){
 var m=getMachine(L.machineId),t=m?m.tarifs:{},days=locDays(L),j=num(t.jour),w=num(t.semaine),we=num(t.weekend),lines=[];
 if(L.forfait==='weekend'&&we)lines.push({des:'Forfait week end',q:1,u:'forfait',pu:we});
 else if(days){
  var weeks=w?Math.floor(days/7):0,rest=days-weeks*7;
  if(w&&rest&&j*rest>=w){weeks++;rest=0;}
  if(weeks)lines.push({des:'Location à la semaine',q:weeks,u:'semaine',pu:w});
  if(rest)lines.push({des:'Location à la journée',q:rest,u:'jour',pu:j});
 }
 if(L.nettoyage&&num(t.nettoyage))lines.push({des:'Nettoyage',q:1,u:'forfait',pu:num(t.nettoyage),v:1});
 var so=L.sortie||{},re=L.retour||{},us=num(so.mesure)-num(re.mesure);
 if(num(t.usureMm)&&String(so.mesure||'')!==''&&String(re.mesure||'')!==''&&us>0)lines.push({des:'Usure disque ('+fq(so.mesure)+' mm au départ, '+fq(re.mesure)+' mm au retour)',q:Math.round(us*10)/10,u:'mm',pu:num(t.usureMm),v:1});
 if(num(L.km))lines.push({des:'Transport',q:num(L.km),u:'km',pu:num(state.settings.prixKm)});
 if(num(L.carburantEur))lines.push({des:'Carburant',q:1,u:'forfait',pu:num(L.carburantEur),v:1});
 if(num(L.fraisEur))lines.push({des:L.fraisLib||'Frais divers',q:1,u:'forfait',pu:num(L.fraisEur),v:1});
 if(num(L.remise))lines.push({des:'Remise',q:1,u:'forfait',pu:-num(L.remise)});
 var tot=0,base=0;lines.forEach(function(l){tot+=l.q*l.pu;if(!l.v)base+=l.q*l.pu;});
 var pct=num(state.settings.acomptePct),ac=Math.round(base*pct)/100;
 return {days:days,lines:lines,total:tot,base:base,extras:tot-base,pct:pct,acompte:ac,solde:tot-ac,reste:tot-(L.acompteRecu?ac:0)-(L.soldeRecu?tot-ac:0)};
}
function lastEntretien(m){var b=null;(m.entretien||[]).forEach(function(e){if(!b||num(e.heures)>num(b.heures))b=e;});return b;}
function entretienDu(m){var iv=num(m.intervalle);if(!iv||String(m.heures)==='')return false;var le=lastEntretien(m);return num(m.heures)-(le?num(le.heures):0)>=iv;}
function machineStatut(m){for(var i=0;i<state.locations.length;i++){var L=state.locations[i];if(L.machineId===m.id&&L.statut==='sortie')return 'louée';}return 'disponible';}
function locConflicts(L){
 var out=[],m=getMachine(L.machineId);if(!m||!L.debut||L.statut==='annulée')return out;
 var f=locEnd(L),nm=String(m.nom||'').trim().toLowerCase();
 state.locations.forEach(function(o){if(o.id!==L.id&&o.machineId===L.machineId&&o.statut!=='annulée'&&o.debut<=f&&L.debut<=locEnd(o))out.push('location '+o.numero+' ('+(o.client.nom||'client ?')+') '+periode(o));});
 if(nm)state.events.forEach(function(e){if(String(e.machine||'').trim().toLowerCase()===nm&&e.debut<=f&&L.debut<=evEnd(e))out.push((e.titre||TYPES[e.type])+' '+periode(e));});
 return out;
}

var GS_CODE="// Synchro de l'appli Chantiers\n// 1. Remplace CHANGE-MOI par un mot de passe à toi (le même que dans l'appli, Réglages).\n// 2. Déployer > Nouveau déploiement > Application Web, Exécuter en tant que : Moi, Accès : Tout le monde.\nvar KEY = 'CHANGE-MOI';\nvar VERSION = 2;\nvar CAL_NAME = 'Chantiers';\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction props_() { return PropertiesService.getScriptProperties(); }\n\nfunction dataFile_() {\n  var p = props_(), id = p.getProperty('dataFile');\n  if (id) { try { return DriveApp.getFileById(id); } catch (e) {} }\n  var f = DriveApp.createFile('chantiers-donnees.json', '{}', MimeType.PLAIN_TEXT);\n  p.setProperty('dataFile', f.getId());\n  return f;\n}\nfunction photoFolder_() {\n  var p = props_(), id = p.getProperty('photoFolder');\n  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }\n  var f = DriveApp.createFolder('Chantiers photos');\n  p.setProperty('photoFolder', f.getId());\n  return f;\n}\nfunction rev_() { return Number(props_().getProperty('rev') || 0); }\n\nfunction doGet(e) {\n  var q = (e && e.parameter) || {};\n  if (q.key !== KEY) return out_({ ok: false, error: 'cle' });\n  if (q.action === 'pull') {\n    return out_({ ok: true, v: VERSION, rev: rev_(), data: dataFile_().getBlob().getDataAsString() });\n  }\n  if (q.action === 'photo') {\n    var it = photoFolder_().getFilesByName(q.id + '.jpg');\n    if (!it.hasNext()) return out_({ ok: false, error: 'absente' });\n    var b = it.next().getBlob();\n    return out_({ ok: true, data: 'data:image/jpeg;base64,' + Utilities.base64Encode(b.getBytes()) });\n  }\n  return out_({ ok: true, v: VERSION, pong: true, rev: rev_() });\n}\n\nfunction doPost(e) {\n  var b = JSON.parse(e.postData.contents);\n  if (b.key !== KEY) return out_({ ok: false, error: 'cle' });\n  var lock = LockService.getScriptLock();\n  lock.waitLock(25000);\n  try {\n    if (b.action === 'push') {\n      if (String(b.rev) !== String(rev_())) return out_({ ok: false, conflict: true, rev: rev_() });\n      dataFile_().setContent(b.data);\n      var r = rev_() + 1;\n      props_().setProperty('rev', String(r));\n      if (b.summary) { try { writeSheets_(b.summary); } catch (err) {} }\n      var ag = '';\n      if (b.agenda) { try { syncAgenda_(b.agenda); ag = 'ok'; } catch (err) { ag = String(err); } }\n      return out_({ ok: true, v: VERSION, rev: r, agenda: ag });\n    }\n    if (b.action === 'photo') {\n      var fo = photoFolder_();\n      if (!fo.getFilesByName(b.id + '.jpg').hasNext()) {\n        var bytes = Utilities.base64Decode(String(b.data).split(',')[1]);\n        fo.createFile(Utilities.newBlob(bytes, 'image/jpeg', b.id + '.jpg'));\n      }\n      return out_({ ok: true });\n    }\n  } finally {\n    lock.releaseLock();\n  }\n  return out_({ ok: false, error: 'action' });\n}\n\n// Copie lisible des données dans les onglets du Google Sheet\nfunction writeSheets_(sum) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!ss) return;\n  Object.keys(sum).forEach(function (name) {\n    var rows = sum[name];\n    var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n    sh.clearContents();\n    if (rows.length && rows[0].length) {\n      sh.getRange(1, 1, rows.length, rows[0].length).setValues(rows);\n      sh.getRange(1, 1, 1, rows[0].length).setFontWeight('bold');\n      sh.setFrozenRows(1);\n    }\n  });\n}\n\n// À exécuter une fois depuis l'éditeur pour autoriser l'accès à Google Agenda\nfunction autoriserAgenda() {\n  var cal = calendar_();\n  Logger.log('Agenda prêt : ' + cal.getName());\n}\n\n// Agenda Google \"Chantiers\" : rendez vous et rappels envoyés par l'appli\nfunction calendar_() {\n  var l = CalendarApp.getCalendarsByName(CAL_NAME);\n  if (l.length) return l[0];\n  return CalendarApp.createCalendar(CAL_NAME, { color: CalendarApp.Color.ORANGE });\n}\nfunction parseDay_(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }\nfunction syncAgenda_(items) {\n  var cal = calendar_();\n  var from = new Date(); from.setDate(from.getDate() - 3); from.setHours(0, 0, 0, 0);\n  var to = new Date(); to.setFullYear(to.getFullYear() + 1);\n  var existing = {};\n  cal.getEvents(from, to).forEach(function (ev) {\n    var k = ev.getTag('ck');\n    if (k) { if (existing[k]) ev.deleteEvent(); else existing[k] = ev; }\n  });\n  var wanted = {};\n  items.forEach(function (it) {\n    wanted[it.k] = 1;\n    var sig = JSON.stringify([it.t, it.d, it.f || '', it.h || '', it.n || '']);\n    var ev = existing[it.k];\n    if (ev && ev.getTag('cs') === sig) return;\n    if (ev) ev.deleteEvent();\n    var start = parseDay_(it.d), ne;\n    if (it.h) {\n      var p = String(it.h).split(':');\n      start.setHours(+p[0], +p[1] || 0, 0, 0);\n      ne = cal.createEvent(it.t, start, new Date(start.getTime() + 3600000), { description: it.n || '' });\n      ne.removeAllReminders();\n      ne.addPopupReminder(60);\n      ne.addPopupReminder(1440);\n    } else {\n      var end = parseDay_(it.f || it.d); end.setDate(end.getDate() + 1);\n      ne = cal.createAllDayEvent(it.t, start, end, { description: it.n || '' });\n      ne.removeAllReminders();\n      ne.addPopupReminder(360);   // la veille à 18 h\n    }\n    ne.setTag('ck', it.k);\n    ne.setTag('cs', sig);\n  });\n  Object.keys(existing).forEach(function (k) { if (!wanted[k]) existing[k].deleteEvent(); });\n}\n";

var chF={all:false};
function suivi(d){if(!d.suivi)d.suivi={avancement:'0',journal:[],depenses:[]};return d.suivi;}
function isHeure(u){u=String(u||'').trim().toLowerCase();return u==='h'||u.indexOf('heure')===0;}
function bilan(d){
 var s=suivi(d),t=totaux(d),hp=0,moP=0,hr=0,dn=0,dc=0,taux=0;
 d.postes.forEach(function(p){if(p.type==='client')return;p.lignes.forEach(function(l){if(isHeure(l.unite)){hp+=num(l.qte);moP+=ligneTot(l);if(!taux)taux=num(l.pu);}});});
 if(!taux)taux=num(state.settings.taux);
 s.journal.forEach(function(j){hr+=num(j.personnes||1)*num(j.heures);});
 s.depenses.forEach(function(x){if(x.qui==='client')dc+=num(x.montant);else dn+=num(x.montant);});
 var moR=hr*taux;
 return {fact:t.facture,client:t.client,hp:hp,hr:hr,dn:dn,dc:dc,taux:taux,moP:moP,moR:moR,aFact:t.facture-moP+moR,envoye:!!s.heuresEnvoyees,av:Math.max(0,Math.min(100,num(s.avancement)))};
}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}
function ecart(a,b,inv){if(!b)return '';var d=a-b,cls=(inv?d<0:d>0)?'bad':'good';return ' <span class="'+cls+'">('+(d>0?'+':'')+fq(Math.round(d*10)/10)+')</span>';}

 return h+'</div>';

var curC=null,clF={q:''};
var CTYPES=['particulier','agriculteur','artisan','entreprise','collectivité'];
function getClient(id){for(var i=0;i<state.clients.length;i++)if(state.clients[i].id===id)return state.clients[i];return null;}
function newClient(o,id){
 o=o||{};
 var c={id:id||uid(),nom:o.nom||'',type:o.type||'particulier',tel:o.tel||'',mail:o.mail||'',adresse:o.adresse||'',ville:o.ville||'',note:'',creeLe:Date.now(),modifieLe:Date.now()};
 state.clients.push(c);return c;
}
function clientsSorted(){return state.clients.slice().sort(function(a,b){return String(a.nom).toLowerCase()<String(b.nom).toLowerCase()?-1:1;});}
function sameName(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()&&String(a||'').trim()!=='';}
function clientDevis(c){return state.devis.filter(function(d){return d.clientId===c.id||(!d.clientId&&sameName(d.client.nom,c.nom));});}
function clientLocs(c){return state.locations.filter(function(L){return L.clientId===c.id||(!L.clientId&&sameName(L.client.nom,c.nom));});}
function clientCA(c){
 var t=0;
 clientDevis(c).forEach(function(d){if(d.statut==='terminé'||d.statut==='payé')t+=totaux(d).facture;});
 clientLocs(c).forEach(function(L){if(L.statut==='rendue'||L.statut==='payée')t+=locCalc(L).total;});
 return t;
}
function clSlug(n){return 'cl_'+String(n||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_');}
function migrateClients(){
 if(state.clientsMigrated)return;
 state.clientsMigrated=true;
 state.devis.forEach(function(d){
  if(d.clientId||!String(d.client.nom||'').trim())return;
  var c=null;state.clients.forEach(function(x){if(sameName(x.nom,d.client.nom))c=x;});
  if(!c)c=newClient(d.client,clSlug(d.client.nom));
  d.clientId=c.id;
 });
 state.locations.forEach(function(L){
  if(L.clientId||!String(L.client.nom||'').trim())return;
  var c=null;state.clients.forEach(function(x){if(sameName(x.nom,L.client.nom))c=x;});
  if(!c)c=newClient({nom:L.client.nom,tel:L.client.tel,adresse:L.client.adresse},clSlug(L.client.nom));
  L.clientId=c.id;
 });
}

var C_LOC='#2a78d6',C_CH='#eb6834',C_TRACK='#e4e3e0';

function eurK(n){n=num(n);return Math.abs(n)>=10000?(Math.round(n/100)/10).toLocaleString('fr-FR')+' k€':Math.round(n).toLocaleString('fr-FR')+' €';}
function revenus(){
 var out=[];
 state.devis.forEach(function(d){
  if(d.statut!=='terminé'&&d.statut!=='payé')return;
  var dt=(d.suivi&&d.suivi.termineLe)||d.dateChantier||d.date;
  out.push({k:'ch',date:dt,montant:totaux(d).facture});
 });

 });

  if(L.machineId!==m.id||L.statut==='annulée'||L.statut==='réservée')return;
  var c=locCalc(L);jours+=c.days;n++;

 });

 return {ca:ca,jours:jours,n:n,ent:ent,net:net,pa:pa,pct:pa?net/pa*100:null,reste:pa?Math.max(0,pa-net):0,occ:since?Math.min(100,jours/since*100):null,since:since,att:att};

var WXC={};
function wxIcon(c){c=+c;if(c===0)return '☀️';if(c<=2)return '🌤️';if(c===3)return '☁️';if(c===45||c===48)return '🌫️';if(c>=51&&c<=57)return '🌦️';if((c>=61&&c<=67)||(c>=80&&c<=82))return '🌧️';if((c>=71&&c<=77)||c===85||c===86)return '🌨️';if(c>=95)return '⛈️';return '🌥️';}

function wxGet(place,cb){
 place=wxPlace(place);if(!place||!window.fetch)return cb(null);
 var key='wx_'+place.toLowerCase();
 if(WXC[key]&&Date.now()-WXC[key].t<3*3600e3)return cb(WXC[key]);
 try{var c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.t<3*3600e3){WXC[key]=c;return cb(c);}}catch(e){}
 if(WXC[key]&&WXC[key].pending){WXC[key].pending.push(cb);return;}
 var waiting=[cb];WXC[key]={t:0,days:{},pending:waiting};
 function done(o){WXC[key]=o||{t:Date.now()-2.5*3600e3,days:{}};waiting.forEach(function(f){f(o);});}
 fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&country_code=FR&name='+encodeURIComponent(place)).then(function(r){return r.json();}).then(function(g){
  if(!g||!g.results||!g.results.length)throw new Error('lieu');
  var r0=g.results[0];
  return fetch('https://api.open-meteo.com/v1/forecast?latitude='+r0.latitude+'&longitude='+r0.longitude+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=Europe%2FParis&forecast_days=16').then(function(r){return r.json();}).then(function(f){
   var o={t:Date.now(),name:r0.name,days:{}},dl=f.daily;
   dl.time.forEach(function(d,i){o.days[d]={c:dl.weather_code[i],max:dl.temperature_2m_max[i],min:dl.temperature_2m_min[i],p:dl.precipitation_sum[i],w:dl.wind_speed_10m_max[i]};});
   try{localStorage.setItem(key,JSON.stringify(o));}catch(e){}
   done(o);
  });
 }).catch(function(){done(null);});
}
function wxWarn(d){var w=[];if(!d)return w;if(d.min<=0)w.push('gel');if(d.p>=5)w.push('pluie');if(d.w>=50)w.push('vent');return w;}

  if(!o)return;
  for(var i=0;i<els.length;i++){
   var d=o.days[els[i].getAttribute('data-wx')];if(!d)continue;

  }

 var byPlace={};
 for(var j=0;j<chips.length;j++){var pl=wxPlace(chips[j].getAttribute('data-wxp'))||wxBase();(byPlace[pl]=byPlace[pl]||[]).push(chips[j]);}

   byPlace[pl].forEach(function(el){
    if(el.getAttribute('data-wxdone'))return;

   var nc2=w==='L'?newClient({nom:co.client.nom,tel:co.client.tel,adresse:co.client.adresse}):newClient(co.client);
   co.clientId=nc2.id;co.modifieLe=Date.now();save();render(true);toast('Client enregistré');break;
  case 'cglReset':if(confirm('Remettre les conditions générales par défaut ?')){s.cgl='';state.settingsModif=Date.now();save();render(true);}break;
  case 'ck':
   var cki=checklist(getMachine(curL.machineId))[i],cko=curL[w];if(!cko.check)cko.check={};
   cko.check[cki]=cko.check[cki]==='ok'?'nok':cko.check[cki]==='nok'?'':'ok';
   curL.modifieLe=Date.now();save();render(true);break;
  case 'dispo':openDispo();break;
  case 'dispoBook':
   var b1=$('dp1').value,b2=$('dp2').value||b1;if(b2<b1)b2=b1;
   var nb=newLoc(el.getAttribute('data-id'));nb.debut=b1;nb.fin=b2;save();closeModal();location.hash='#location-'+nb.id;break;
  case 'incAdd':
   incidents(curC).push({id:uid(),date:$('inD').value||today(),type:$('inT').value,note:$('inN').value.trim(),montant:$('inM').value});
   curC.modifieLe=Date.now();save();render(true);toast('Incident noté');break;
  case 'incDel':if(confirm('Supprimer cet incident ?')){curC.incidents.splice(i,1);curC.modifieLe=Date.now();save();render(true);}break;
  case 'chAll':chF.all=!chF.all;render(true);break;
  case 'syncNow':sync(true);break;
  case 'syncSave':
   var su=$('syU').value.trim(),sk=$('syK').value.trim();
   if(su&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(su)){toast('L’adresse doit commencer par https://script.google.com/');break;}
   var sm=syncMeta();sm.url=su;sm.key=sk;setSyncMeta(sm);setSyncIcon();
   if(su&&sk)sync(true);else toast('Adresse et mot de passe nécessaires');
   break;
  case 'syncOff':if(confirm('Désactiver la synchro sur cet appareil ? Tes données restent ici et sur Google.')){setSyncMeta({});SYNC.err='';setSyncIcon();render(true);}break;
  case 'copyScript':
   var gt=$('gsTxt');gt.value=GS_CODE;gt.classList.remove('hidden');gt.focus();gt.select();gt.setSelectionRange(0,gt.value.length);
   var okg=false;try{okg=document.execCommand('copy');}catch(e3){}
   toast(okg?'Script copié':'Texte sélectionné : touche Copier');break;
  case 'importTxt':var tx=$('impTxt').value.trim();if(tx)doImport(tx);break;
 }
});

load();
migrateClients();
render(false);
setSyncIcon();
setTimeout(function(){sync(false);},1200);
window.addEventListener('online',function(){sync(false);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync(false);});
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');}catch(e){}
})();
</script>
